name: Rebuild data index

# Runs whenever a snapshot is added or changed. It validates every file in
# data/archive/ and rewrites data/index.json, then commits the result.
on:
  push:
    branches: [main]
    paths:
      - "data/archive/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate snapshots and rebuild index
        run: python scripts/build_index.py
      - name: Commit index if it changed
        run: |
          if git diff --quiet -- data/index.json; then
            echo "index.json already up to date"
          else
            git config user.name "govbid-bot"
            git config user.email "govbid-bot@users.noreply.github.com"
            git add data/index.json
            git commit -m "Rebuild data/index.json"
            git push
          fi
